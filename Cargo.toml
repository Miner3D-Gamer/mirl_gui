[package]
name = "mirl_gui"
version = "0.0.0-alpha"
edition = "2024"
repository.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = [
    "bitcode?/std",
    "mirl_buffer/std",
    "mirl_extensions/std",
    "mirl_graphics/std",
    "mirl_rendering/std",
    "mirl_windowing_core/std",
    "serde?/std",
    "wincode?/std",
    "zerocopy?/std",
]
all = [
    "mirl_buffer/all",
    "mirl_collections/all",
    "mirl_extensions/all",
    "mirl_graphics/all",
    "mirl_rendering/all",
    "mirl_windowing_core/all",
]
_checking = ["all_codecs"]
# Does nothing by itself. Needs another codec or enum flag to do something
mirl_derive = [
    "dep:mirl_derive",
    "mirl_buffer/mirl_derive",
    "mirl_collections/mirl_derive",
    "mirl_graphics/mirl_derive",
    "mirl_rendering/mirl_derive",
    "mirl_windowing_core/mirl_derive",
]
# Compatibility with ffi
c_compatible = [
    "mirl_derive",
    "mirl_buffer/c_compatible",
    "mirl_collections/c_compatible",
    "mirl_extensions/c_compatible",
    "mirl_graphics/c_compatible",
    "mirl_rendering/c_compatible",
    "mirl_windowing_core/c_compatible",
]
# Enables all codecs
all_codecs = [
    "serde",
    "bitcode",
    "wincode",
    "compactly",
    "zerocopy",
    "mirl_buffer/all_codecs",
    "mirl_collections/all_codecs",
    "mirl_graphics/all_codecs",
    "mirl_rendering/all_codecs",
    "mirl_windowing_core/all_codecs",
]
# # # All enum extensions# all_enum_extensions = ["strum", "enum_ext"]
# Codec stuff
serde = [
    "dep:serde",
    "mirl_derive",
    "arc-swap/serde",
    "bitcode?/serde",
    "mirl_buffer/serde",
    "mirl_collections/serde",
    "mirl_graphics/serde",
    "mirl_rendering/serde",
    "mirl_windowing_core/serde",
]
bitcode = [
    "dep:bitcode",
    "mirl_derive",
    "mirl_buffer/bitcode",
    "mirl_collections/bitcode",
    "mirl_graphics/bitcode",
    "mirl_rendering/bitcode",
    "mirl_windowing_core/bitcode",
]
wincode = [
    "dep:wincode",
    "mirl_derive",
    "mirl_buffer/wincode",
    "mirl_collections/wincode",
    "mirl_graphics/wincode",
    "mirl_rendering/wincode",
    "mirl_windowing_core/wincode",
]
compactly = [
    "dep:compactly",
    "mirl_derive",
    "mirl_buffer/compactly",
    "mirl_collections/compactly",
    "mirl_graphics/compactly",
    "mirl_rendering/compactly",
    "mirl_windowing_core/compactly",
]
zerocopy = [
    "dep:zerocopy",
    "mirl_derive",
    "mirl_buffer/zerocopy",
    "mirl_collections/zerocopy",
    "mirl_graphics/zerocopy",
    "mirl_rendering/zerocopy",
    "mirl_windowing_core/zerocopy",
]

# # Enum extensions
# strum = ["dep:strum", "mirl_derive"]
# enum_ext = ["dep:enum_ext", "mirl_derive"]

[dependencies]
arc-swap = { version = "1.9" } # Multithread support
bitcode = { version = "0.6", optional = true, default-features = false, features = [
    "derive",
] }
# Codec
compactly = { version = "0.1", optional = true }
mirl_buffer = { version = "0.0.0-alpha" }
mirl_collections = { version = "0.0.0-alpha" }
mirl_derive = { version = "0.0.0-alpha", optional = true }
mirl_extensions = { version = "0.0.0-alpha" }
mirl_graphics = { version = "0.0.0-alpha" }
mirl_rendering = { version = "0.0.0-alpha" }
mirl_windowing_core = { version = "0.0.0-alpha" }
serde = { version = "1.0", optional = true, default-features = false, features = [
    "derive",
] }
wincode = { version = "0.5", optional = true, features = ["derive"] }
zerocopy = { version = "0.8", optional = true, default-features = false, features = [
    "float-nightly",
    "derive",
] }

[build-dependencies]
mirl_build_tools = { workspace = true }

# # Enum functionality
# strum = { version = "0.28", optional = true, default-features = false, features = [
#     "derive",
# ] }
# enum_ext = { version = "0.6", optional = true, default-features = false }

[lints]
workspace = true
